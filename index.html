<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://servicebus2.caixa.gov.br https://loteriascaixa-api.herokuapp.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loto Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lotofácil Lab</title>
<style>
:root{--bg:#120c1c;--card:#1c1430;--card2:#241a3c;--line:#33284d;--tx:#f1ecf8;--mu:#a69bbb;--ac:#b14cff;--ac2:#ff4fa3;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(18,12,28,.92);backdrop-filter:blur(10px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header img{width:30px;height:30px;border-radius:8px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{margin-left:auto;font-size:12px;color:var(--mu);text-align:right}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--mu);font-weight:600}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font:600 15px system-ui;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;width:100%}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:11px}
.btn.danger{background:#3a1622;color:#ffb3c1;border:1px solid #5a2333}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.balls{display:flex;flex-wrap:wrap;gap:5px}
.b{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font:700 13px system-ui;background:var(--card2);border:1px solid var(--line)}
.b.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.b.hit{background:var(--ok);color:#06281a;border-color:transparent}
.game{padding:10px 0;border-top:1px dashed var(--line)}
.game:first-of-type{border-top:0}
.game .lbl{font-size:12px;color:var(--mu);margin-bottom:6px;display:flex;justify-content:space-between}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line)}
.pill.ok{background:rgba(61,220,151,.15);color:var(--ok);border-color:rgba(61,220,151,.35)}
.pill.ac{background:rgba(177,76,255,.18);color:#dcb2ff;border-color:rgba(177,76,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--mu)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.vol{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.vol button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:700 17px system-ui}
.vol button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff}
.heat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.heat div{border-radius:12px;padding:8px 2px;text-align:center;border:1px solid var(--line)}
.heat b{display:block;font-size:16px}
.heat span{font-size:10.5px;color:#e9e2f5;opacity:.85;display:block}
input,textarea,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font:15px system-ui}
textarea{min-height:90px;font-size:13px}
label.f{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.rk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.bar i.ctl{background:var(--mu)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px;border-radius:9px;font:600 13px system-ui}
.seg button.on{background:var(--card);color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(24,17,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 11px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0}
nav button svg{width:23px;height:23px}
nav button.on{color:#e3c2ff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2d2245;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
.hist{padding:10px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.note{font-size:12.5px;color:var(--mu);background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px}
.prog{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .15s}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px}
.switch input{width:46px;height:26px;appearance:none;background:var(--card2);border:1px solid var(--line);border-radius:99px;position:relative;padding:0;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.switch input:checked{background:var(--ac)}
.switch input:checked::after{left:22px;background:#fff}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:6px 0}
a{color:#dcb2ff}
.cand{border-radius:14px;padding:10px;margin:6px -10px;border:1px solid transparent;cursor:pointer;border-top:1px solid transparent}
.cand:not(.sel){opacity:.55}
.cand.sel{border-color:rgba(177,76,255,.5);background:rgba(177,76,255,.08)}
.folder summary{list-style:none;flex-wrap:nowrap}
.folder.win{border-color:rgba(61,220,151,.45);background:linear-gradient(180deg,rgba(61,220,151,.08),var(--card) 60%)}
.fic{font-size:26px}
nav button{font-size:10.5px}
.pill.wn{background:rgba(255,184,77,.15);color:var(--warn);border-color:rgba(255,184,77,.4)}
.folder.maybe{border-color:rgba(255,184,77,.4)}
.lote{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.help{margin-left:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:700 15px system-ui;flex:none}
.simbox{margin-top:14px;padding:12px;border-radius:14px;background:var(--card2)}
.simbox .rk{border-top-color:#3a2f55}
.ajuda p,.ajuda li{font-size:14px;color:#ddd5ea}
.ajuda ul{padding-left:18px}
.lnk{background:none;border:0;color:#ff9ab5;font:600 12px system-ui;padding:0}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <h1>Lotofácil Lab</h1>
  <div class="sub" id="hdr"></div><button class="help" onclick="go('ajuda')" aria-label="Como funciona">?</button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const pop = x => { let c = 0; while (x) { x &= x - 1; c++; } return c; };
const toMask = ns => ns.reduce((m, n) => m | (1 << (n - 1)), 0);
const toNums = m => { const r = []; for (let i = 1; i <= 25; i++) if (m & (1 << (i - 1))) r.push(i); return r; };
const pad = n => String(n).padStart(2, '0');
const brl = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const MOLD = new Set([1,2,3,4,5,6,10,11,15,16,20,21,22,23,24,25]);
const PRIMOS = new Set([2,3,5,7,11,13,17,19,23]);
const sleep = () => new Promise(r => setTimeout(r, 0));
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('show'), 2200); }

/* ================= estado ================= */
const KEY = 'lotolab-v1';
const DEF = () => ({ draws: [], rounds: [], score: {}, bt: null, cfg: { jogos: 2, preco: 3.5, p11: 7, p12: 14, p13: 35, p14: 1500, p15: 1500000, janela: 20 } });
const okData = v => typeof v === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(v) ? v : null;
const esc = v => String(v ?? '').replace(/[&<>"'`]/g, ch => '&#' + ch.charCodeAt(0) + ';');
// Valida tudo que vem do armazenamento ou de um backup: só números, ids conhecidos e datas no formato dd/mm/aaaa
function limpa(o) {
  const N = (v, d = 0) => (typeof v === 'number' || (typeof v === 'string' && v.trim() !== '')) && Number.isFinite(+v) ? +v : d;
  const I = (v, d = 0) => Math.trunc(N(v, d)), out = DEF(), obj = x => x && typeof x === 'object' && !Array.isArray(x), arr = x => Array.isArray(x) ? x : [];
  if (!obj(o)) return out;
  const IDS = ['aleat', 'padrao', 'quentes', 'recentes', 'atrasados'], sid = v => IDS.includes(v) ? v : 'padrao';
  const mask = v => { const m = I(v, -1); return m > 0 && m < (1 << 25) && pop(m) === 15 ? m : null; };
  const sc = x => obj(x) ? { j: Math.max(0, I(x.j)), h: [0, 1, 2, 3, 4].map(i => Math.max(0, I(arr(x.h)[i]))) } : null;
  const scs = x => { const r = {}; if (obj(x)) for (const k of IDS) { const v = sc(x[k]); if (v) r[k] = v; } return r; };
  if (obj(o.cfg)) for (const k in out.cfg) if (k in o.cfg) out.cfg[k] = Math.max(0, N(o.cfg[k], out.cfg[k]));
  out.cfg.jogos = Math.min(200, Math.max(1, Math.trunc(out.cfg.jogos))); out.cfg.janela = Math.min(500, Math.max(5, Math.trunc(out.cfg.janela)));
  out.draws = arr(o.draws).filter(obj).map(d => ({ c: I(d.c), n: arr(d.n).map(x => I(x)).filter(x => x >= 1 && x <= 25), d: okData(d.d) }))
    .filter(d => d.c > 0 && d.n.length === 15 && new Set(d.n).size === 15).map(d => (d.n.sort((a, b) => a - b), d));
  out.rounds = arr(o.rounds).filter(obj).map(r => {
    const st = sid(r.strat), shadow = {}; if (obj(r.shadow)) for (const k of IDS) if (Array.isArray(r.shadow[k])) shadow[k] = r.shadow[k].map(mask).filter(Boolean);
    const x = { id: I(r.id), c: I(r.c), ts: N(r.ts, Date.now()), strat: st, shadow, mine: arr(r.mine).map(mask).filter(Boolean), preco: Math.max(0, N(r.preco, out.cfg.preco)), res: r.res == null ? null : mask(r.res) };
    if (Array.isArray(r.lotes)) x.lotes = r.lotes.filter(obj).map(l => ({ id: I(l.id), ts: N(l.ts, Date.now()), strat: sid(l.strat), jogos: arr(l.jogos).filter(obj).map(j => ({ m: mask(j.m), st: ['novo', 'salvo', 'rasc'].includes(j.st) ? j.st : 'rasc', sel: !!j.sel })).filter(j => j.m) })).filter(l => l.id > 0);
    else { x.cands = arr(r.cands).filter(obj).map(c => ({ m: mask(c.m), s: st, sv: !!c.sv })).filter(c => c.m); x.apostou = r.apostou !== false; if (!x.cands.length) delete x.cands; }
    return x;
  }).filter(r => r.id > 0 && r.c > 0);
  out.score = scs(o.score);
  if (obj(o.bt) && obj(o.bt.sc)) out.bt = { K: I(o.bt.K), k: I(o.bt.k), ts: N(o.bt.ts), de: I(o.bt.de), ate: I(o.bt.ate), sc: scs(o.bt.sc) };
  if (obj(o.prox)) out.prox = { c: I(o.prox.c), d: okData(o.prox.d) };
  if (obj(o.sync)) out.sync = { ts: N(o.sync.ts), ok: !!o.sync.ok, src: ['Caixa', 'Comunidade'].includes(o.sync.src) ? o.sync.src : '?', c: I(o.sync.c) };
  return out;
}
let S;
try { S = limpa(JSON.parse(localStorage.getItem(KEY))); } catch (e) { S = DEF(); }
function migra() {
  for (const r of S.rounds) {
    if (!r.cands && !r.lotes) { const ok = r.apostou !== false; r.cands = (r.mine || []).map(m => ({ m, s: r.strat, sv: ok })); }
    delete r.apostou;
    if (!r.lotes) { r.lotes = [{ id: r.id, ts: r.ts, strat: r.strat, jogos: (r.cands || []).map(x => ({ m: x.m, st: x.sv ? 'salvo' : (r.res ? 'rasc' : 'novo'), sel: true })) }]; delete r.cands; }
    r.mine = salvos(r); if (r.res) { r.hits = r.mine.map(g => pop(g & r.res)); r.premio = r.hits.reduce((a, x) => a + (x >= 11 ? (S.cfg['p' + x] || 0) : 0), 0); }
  }
}
migra();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Não consegui salvar no aparelho'); } }
const prize = h => h >= 11 ? (S.cfg['p' + h] || 0) : 0;

/* ================= estatística ================= */
function feat(m) { let p = 0, s = 0, mo = 0, q = 0; for (let i = 1; i <= 25; i++) if (m & (1 << (i - 1))) { if (i % 2 === 0) p++; s += i; if (MOLD.has(i)) mo++; if (PRIMOS.has(i)) q++; } return { p, s, mo, q }; }
class Hist {
  constructor() { this.n = 0; this.cnt = Array(26).fill(0); this.last = Array(26).fill(-1); this.recent = []; this.hp = Array(16).fill(0); this.hs = Array(400).fill(0); this.hm = Array(17).fill(0); this.hq = Array(10).fill(0); this.hr = Array(16).fill(0); this.lastMask = 0; }
  add(nums) {
    const m = toMask(nums), f = feat(m);
    this.hp[f.p]++; this.hs[f.s]++; this.hm[f.mo]++; this.hq[f.q]++;
    if (this.n > 0) this.hr[pop(m & this.lastMask)]++;
    for (const x of nums) { this.cnt[x]++; this.last[x] = this.n; }
    this.recent.push(m); if (this.recent.length > 200) this.recent.shift();
    this.lastMask = m; this.n++;
  }
  ranges() {
    if (this.n < 30) return null;
    const pr = h => { const t = h.reduce((a, b) => a + b, 0); let acc = 0, lo = null; for (let i = 0; i < h.length; i++) { acc += h[i]; if (lo === null && acc >= t * .1) lo = i; if (acc >= t * .9) return [lo, i]; } return [lo, h.length - 1]; };
    return { p: pr(this.hp), s: pr(this.hs), mo: pr(this.hm), q: pr(this.hq), r: pr(this.hr) };
  }
  recentCount(J) { const c = Array(26).fill(0); for (const m of this.recent.slice(-J)) for (let i = 1; i <= 25; i++) if (m & (1 << (i - 1))) c[i]++; return c; }
  atraso(x) { return this.last[x] < 0 ? this.n : this.n - 1 - this.last[x]; }
}
let _H = null, _Hn = -1;
function hist() { if (_Hn !== S.draws.length) { _H = new Hist(); for (const d of S.draws) _H.add(d.n); _Hn = S.draws.length; } return _H; }
const zw = (arr, k) => { const v = arr.slice(1), mu = v.reduce((a, b) => a + b, 0) / 25, sd = Math.sqrt(v.reduce((a, b) => a + (b - mu) ** 2, 0) / 25) || 1; return [0, ...v.map(x => Math.exp(k * (x - mu) / sd))]; };

/* ================= estratégias ================= */
const STRATS = [
  { id: 'aleat', nome: 'Aleatório puro', desc: 'Controle: sorteia 15 números sem critério nenhum.', ctl: true, filtro: false, w: null },
  { id: 'padrao', nome: 'Padrões típicos', desc: 'Aleatório, mas só aceita jogos com pares/ímpares, soma, moldura, primos e repetidos dentro do que mais acontece.', filtro: true, w: null },
  { id: 'quentes', nome: 'Mais sorteados', desc: 'Favorece os números que mais saíram na história toda + filtros de padrão.', filtro: true, w: h => zw(h.cnt, .8) },
  { id: 'recentes', nome: 'Quentes recentes', desc: 'Favorece os números que mais saíram nos últimos concursos + filtros.', filtro: true, w: h => zw(h.recentCount(S.cfg.janela), .8) },
  { id: 'atrasados', nome: 'Atrasados', desc: 'Favorece os números que estão há mais concursos sem sair + filtros.', filtro: true, w: h => [0, ...Array.from({ length: 25 }, (_, i) => 1 + .7 * h.atraso(i + 1))] }
];
const SN = id => (STRATS.find(s => s.id === id) || {}).nome || esc(id);
function amostra(w) {
  const k = []; for (let i = 1; i <= 25; i++) k.push([w ? Math.pow(Math.random(), 1 / w[i]) : Math.random(), i]);
  k.sort((a, b) => b[0] - a[0]); return toMask(k.slice(0, 15).map(x => x[1]));
}
function passa(m, R, h) {
  const f = feat(m), ok = (v, r) => v >= r[0] && v <= r[1];
  if (!ok(f.p, R.p) || !ok(f.s, R.s) || !ok(f.mo, R.mo) || !ok(f.q, R.q)) return false;
  if (h.n > 0 && !ok(pop(m & h.lastMask), R.r)) return false;
  return true;
}
function gerar(h, sid, k, excl = []) {
  const st = STRATS.find(s => s.id === sid), w = st.w ? st.w(h) : null, R = st.filtro ? h.ranges() : null;
  const out = []; let g = 0;
  while (out.length < k && g < 30000) {
    g++; const m = amostra(w), strict = g < 20000;
    if (out.includes(m) || excl.includes(m)) continue;
    if (R && strict && !passa(m, R, h)) continue;
    if (strict && out.some(o => pop(o & m) > 12)) continue;
    out.push(m);
  }
  return out;
}

/* ================= placar das estratégias ================= */
const emptySc = () => ({ j: 0, h: [0, 0, 0, 0, 0] });
function acc(sc, hits) { sc.j++; if (hits >= 11) sc.h[hits - 11]++; }
const retOf = sc => sc.h.reduce((a, c, i) => a + c * prize(11 + i), 0);
const fixOf = sc => sc.h.slice(0, 3).reduce((a, c, i) => a + c * prize(11 + i), 0);
function ranking(sc = S.score) {
  const rows = STRATS.map(s => ({ s, sc: sc[s.id] || emptySc() }));
  // o líder é decidido pelos prêmios fixos (11–13): 14 e 15 são raros demais e distorceriam tudo
  const tj = rows.reduce((a, r) => a + r.sc.j, 0), base = tj ? rows.reduce((a, r) => a + fixOf(r.sc), 0) / tj : 0, P0 = 300;
  rows.forEach(r => { r.adj = (fixOf(r.sc) + P0 * base) / (r.sc.j + P0); r.ret = retOf(r.sc); r.hit = r.sc.j ? r.sc.h.reduce((a, b) => a + b, 0) / r.sc.j : 0; });
  return rows.sort((a, b) => b.adj - a.adj);
}
function lider() { const r = ranking(); const tot = r.reduce((a, x) => a + x.sc.j, 0); return tot ? r[0].s.id : 'padrao'; }

/* ================= importação ================= */
async function unzip(buf) {
  const dv = new DataView(buf); let e = buf.byteLength - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};
  for (let i = 0; i < n; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[new TextDecoder().decode(new Uint8Array(buf, p + 46, nl))] = { m: dv.getUint16(p + 10, true), cs: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };

async function getJSON(url) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 12000);
  try { const r = await fetch(url, { signal: ac.signal, cache: 'no-store', headers: { Accept: 'application/json' } }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }

  if (!(c > 0) || !Array.isArray(dz) || dz.length !== 15) return null;
  const n = dz.map(Number).filter(x => x >= 1 && x <= 25).sort((a, b) => a - b);
  if (new Set(n).size !== 15) return null;
  const proxC = +(j.numeroConcursoProximo ?? j.proximoConcurso ?? (c + 1)), proxD = j.dataProximoConcurso ?? j.dataProxConcurso ?? null;

async function buscaConcurso(c) {
  let err;
  for (const f of FONTES) { try { const r = normaliza(await getJSON(f.url(c))); if (r) return { ...r, src: f.nome }; } catch (e) { err = e; } }
  throw err || new Error('sem resposta');
}
let sincronizando = false;
async function sincronizar(manual) {
  if (sincronizando) return; if (!manual && S.sync && Date.now() - S.sync.ts < 10 * 60e3 && S.sync.ok) return;
  sincronizando = true; if (manual) { toast('Buscando resultado…'); }
  try {
    const ult = await buscaConcurso(); const last = S.draws.at(-1)?.c || 0, novos = [];
    S.prox = ult.prox;
    if (!last) { S.sync = { ts: Date.now(), ok: true, src: ult.src, c: ult.c }; save(); if (manual) toast('Sem histórico ainda: importe a planilha ou baixe o histórico em Ajustes'); return; }
    // preenche buracos dos últimos 30 concursos (ex.: dias sem abrir o app)
    const tem = new Set(S.draws.map(d => d.c));
    for (let c = Math.max(S.draws[0].c, ult.c - 30); c < ult.c; c++) if (!tem.has(c)) { try { novos.push(await buscaConcurso(c)); } catch (e) {} }
    novos.push(ult);
    const antes = S.rounds.filter(r => !r.res).map(r => r.id);
    const r = mergeDraws(novos.map(x => ({ c: x.c, n: x.n, d: x.d })));
    S.sync = { ts: Date.now(), ok: true, src: ult.src, c: ult.c }; save();
    const conf = S.rounds.filter(x => antes.includes(x.id) && x.res), ganho = conf.reduce((a, x) => a + (x.premio || 0), 0);

}

async function backtest(K, k) {
  const D = S.draws, N = D.length; K = Math.min(K, N - 50); if (K < 10) return toast('Preciso de pelo menos 60 concursos');

  const h = new Hist(); for (let i = 0; i < N - K; i++) h.add(D[i].n);
  const sc = {}; STRATS.forEach(s => sc[s.id] = emptySc());
  for (let i = N - K; i < N; i++) {
    const dm = toMask(D[i].n);
    for (const s of STRATS) for (const g of gerar(h, s.id, k)) acc(sc[s.id], pop(g & dm));
    h.add(D[i].n);

  S.bt = { K, k, ts: Date.now(), sc, de: D[N - K].c, ate: D[N - 1].c }; save(); UI.bt = null; render(); toast('Teste concluído');
}

  const h = hist(), J = S.cfg.janela, all = UI.numJ === 'todos', cnt = all ? h.cnt : h.recentCount(J), n = all ? h.n : Math.min(J, h.n);
  const fr = cnt.slice(1).map(c => c / n), mn = Math.min(...fr), mx = Math.max(...fr), R = h.ranges();
  const cell = i => { const t = (fr[i] - mn) / ((mx - mn) || 1); return `<div style="background:rgba(${Math.round(80 + 175 * t)},${Math.round(50 + 30 * t)},${Math.round(200 - 40 * t)},${.25 + .6 * t})"><b>${pad(i + 1)}</b><span>${pct(fr[i])}</span><span>atraso ${h.atraso(i + 1)}</span></div>`; };
  let html = `<div class="card"><h2>Frequência</h2><div class="seg"><button class="${all ? 'on' : ''}" onclick="UI.numJ='todos';render()">Todos (${h.n})</button><button class="${all ? '' : 'on'}" onclick="UI.numJ='rec';render()">Últimos ${J}</button></div>
    <div class="heat">${Array.from({ length: 25 }, (_, i) => cell(i)).join('')}</div>
    <p class="mu" style="margin:10px 0 0">% = em quantos sorteios o número saiu. Atraso = concursos seguidos sem sair. O esperado para qualquer número é 60%.</p></div>`;
  if (R) html += `<div class="card"><h2>Padrões típicos</h2><p class="mu" style="margin-top:0">Faixas onde caem 80% dos sorteios:</p>
    ${[['Pares', R.p], ['Soma das dezenas', R.s], ['Números da moldura', R.mo], ['Primos', R.q], ['Repetidos do anterior', R.r]].map(([a, b]) => `<div class="row sp" style="padding:6px 0;border-top:1px solid var(--line)"><span>${a}</span><b>${b[0]} a ${b[1]}</b></div>`).join('')}
    <h3>Último sorteio (#${S.draws.at(-1).c})</h3>${balls(h.lastMask)}</div>`;
  return html;
}

function vAjustes() {
  const c = S.cfg, last = S.draws.at(-1);
  return `<div class="card"><h2>Resultados automáticos</h2><p class="mu" style="margin-top:0">O app busca o último resultado na internet sempre que você abre, confere suas pastas e mostra a data do próximo sorteio.</p>
    <p class="mu">${syncTxt()}</p><div class="grid2"><button class="btn" onclick="sincronizar(true)">Buscar agora</button><button class="btn sec" onclick="baixarHistorico()">Baixar histórico completo</button></div></div>
  <div class="card"><h2>Sorteios</h2><p class="mu" style="margin-top:0">${S.draws.length ? `${S.draws.length} concursos carregados · último: <b>#${last.c}</b>` : 'Nenhum sorteio carregado.'}</p>
    <label class="btn" style="display:block;text-align:center">Importar planilha (.xlsx, .csv, .htm)<input type="file" accept=".xlsx,.xls,.csv,.txt,.htm,.html,.json" hidden onchange="this.files[0]&&importFile(this.files[0]);this.value=''"></label>
    <label class="f">Ou cole os resultados (uma linha por concurso: número + 15 dezenas)</label><textarea id="pasteD" placeholder="3850 01 02 04 05 …"></textarea>
    <div style="margin-top:8px"><button class="btn sec" onclick="importText()">Adicionar</button></div>
    <a href="https://loterias.caixa.gov.br/Paginas/Lotofacil.aspx" target="_blank" rel="noopener" style="display:block;margin-top:12px;font-size:13px">Baixar planilha no site da Caixa</a></div>
  <div class="card"><h2>Jogo</h2><div class="grid2">
    <div><label class="f">Jogos por concurso</label><input type="number" min="1" max="50" value="${c.jogos}" onchange="setC('jogos',this.value)"></div>
    <div><label class="f">Preço da aposta</label><input type="number" step="0.5" value="${c.preco}" onchange="setC('preco',this.value)"></div>
    <div><label class="f">Janela "recentes"</label><input type="number" min="5" max="200" value="${c.janela}" onchange="setC('janela',this.value)"></div>
    <div><label class="f">Custo por concurso</label><input disabled value="${brl(c.jogos * c.preco)}"></div></div>
    <h3>Prêmios (11–13 fixos, 14–15 estimados)</h3><div class="grid2">
    ${[11, 12, 13, 14, 15].map(k => `<div><label class="f">${k} acertos</label><input type="number" value="${c['p' + k]}" onchange="setC('p${k}',this.value)"></div>`).join('')}</div></div>
  <div class="card"><h2>Backup</h2><p class="mu" style="margin-top:0">Os dados ficam só neste celular. Faça backup de vez em quando.</p>
    <div class="grid2"><button class="btn sec" onclick="copiar(JSON.stringify(S))">Copiar backup</button><button class="btn sec" onclick="baixar()">Baixar arquivo</button></div>
    <label class="f">Restaurar (cole o backup ou importe o .json acima)</label><textarea id="rest"></textarea>
    <div style="margin-top:8px"><button class="btn sec" onclick="restore($('#rest').value)">Restaurar</button></div></div>
  <div class="card"><h2>Zerar</h2><div class="grid2"><button class="btn danger" onclick="zerar('placar')">Zerar ranking</button><button class="btn danger" onclick="zerar('tudo')">Apagar tudo</button></div><p class="mu" id="zmsg"></p></div>
  <p class="mu" style="text-align:center">Uso pessoal. Loteria é sorte: nenhum método muda a chance de cada jogo.</p>`;
}
function setC(k, v) { S.cfg[k] = Math.max(k === 'preco' ? 0 : 1, +v || 0); save(); render(); }
function importText() { const d = rowsToDraws(textRows($('#pasteD').value)); if (!d.length) return toast('Não achei sorteios no texto'); const r = mergeDraws(d); toast(`${r.add} concursos novos`); render(); }
function baixar() { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'lotolab-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); } catch (e) { toast('Use "Copiar backup"'); } }
function restore(t) { try { if (String(t).length > 20e6) throw 0; const o = JSON.parse(t); if (!o || !Array.isArray(o.draws)) throw 0; S = limpa(o); migra(); _Hn = -1; save(); toast('Backup restaurado'); render(); } catch (e) { toast('Backup inválido'); } }
let zConf = null;
function zerar(o) {
  if (zConf !== o) { zConf = o; $('#zmsg').textContent = 'Toque de novo para confirmar.'; return; }
  zConf = null; if (o === 'tudo') S = DEF(); else { S.score = {}; S.bt = null; } _Hn = -1; save(); toast('Feito'); render();
}

function render() {
  nav();
  $('#hdr').innerHTML = S.draws.length ? `último #${S.draws.at(-1).c}` : '';
  $('#app').innerHTML = ({ ajuda: vAjuda, jogar: vJogar, salvos: vSalvos, resultado: vResultado, ranking: vRanking, numeros: vNumeros, ajustes: vAjustes })[UI.tab]();
}
try { history.replaceState({ n: 0 }, '', '#jogar'); } catch (e) {}
render();
sincronizar(false);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(false); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
